[package]
name = "swpreq"
version = "0.2.0"
edition = "2021"
description = "Powerful cross-language HTTP client and server with Rust core"
license = "MIT"

[lib]
name = "swpreq"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tokio = { version = "1.40", features = [
    "rt-multi-thread", "net", "time", "macros", "io-util",
    "sync", "fs", "process", "signal",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls", "gzip", "brotli", "deflate", "zstd",
    "cookies", "json", "multipart", "stream",
    "socks", "http2", "charset",
] }
axum = { version = "0.7", features = ["ws", "multipart", "macros", "http2", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = [
    "fs", "cors", "compression-gzip", "compression-br",
    "compression-zstd", "trace", "set-header", "limit",
] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
once_cell = "1.20"
parking_lot = "0.12"
blake3 = "1.5"
base64 = "0.22"
thiserror = "2.0"
mime_guess = "2.0"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
rand = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
subtle = "2.6"
zeroize = { version = "1.8", features = ["derive"] }
tracing = "0.1"

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"