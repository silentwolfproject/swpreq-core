[package]
name = "swpreq"
version = "0.1.0"
edition = "2021"
description = "Powerful cross-language HTTP client"
license = "MIT"

[lib]
name = "swpreq"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
    "zstd",
    "cookies",
    "json",
    "multipart",
    "stream",
    "socks",
    "http2",
    "charset",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
once_cell = "1.20"
parking_lot = "0.12"
blake3 = "1.5"
base64 = "0.22"
thiserror = "2.0"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
mime_guess = "2.0"
hmac = "0.12"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
cbindgen = "0.27"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

[features]
default = []
http3-enabled = []